<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f5">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./web/core2/master.css">
<title>Royall Web Apps</title>
<style>
:root{--bg:#f3f6f5;--surface:#fff;--line:#dfe9e5;--text:#17342f;--muted:#70807c;--green:#0f766e;--green2:#0d8a56;--shadow:0 5px 18px rgba(25,74,65,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:620px;margin:0 auto;padding:15px}.screen{display:none}.screen.active{display:block}
.hero{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.hero h2{margin:0;font-size:21px;line-height:1.2;letter-spacing:-.3px}.hero p{margin:6px 0 0;color:var(--muted);font-size:11.5px;line-height:1.4}.search{margin-top:12px;position:relative}.search span{position:absolute;left:12px;top:8px;color:#81908b;font-size:17px}.search input{width:100%;height:37px;padding:0 12px 0 35px;border:1px solid #cfe0da;border-radius:10px;background:#fff;color:var(--text);outline:none;font-size:12px}.search input:focus{border-color:#8fcabd;box-shadow:0 0 0 3px rgba(15,118,110,.06)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}.tile{width:100%;min-height:72px;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff;color:inherit;text-decoration:none;text-align:left;box-shadow:var(--shadow);font:inherit;cursor:pointer}.tile:active{transform:scale(.985)}.tile-icon{width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:12px;font-size:12px;font-weight:900}.green{background:#e5f7ee;color:#14935b}.teal{background:#e4f7f6;color:#078b87}.amber{background:#fff4d9;color:#b47a00}.blue{background:#e8f1ff;color:#3778ca}.tile-body{min-width:0;flex:1}.tile-name{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile-desc{margin-top:3px;color:var(--muted);font-size:9.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back{border:0;background:transparent;color:var(--green2);font-weight:800;font-size:12px;padding:0;margin-top:14px;cursor:pointer}.page-head{display:flex;align-items:center;gap:10px;margin:12px 0}.page-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;font-weight:900}.page-head h2{margin:0;font-size:19px}.page-head p{margin:3px 0 0;color:var(--muted);font-size:11px}.empty,.error{margin-top:13px;padding:22px 15px;border-radius:13px;text-align:center;font-size:11.5px}.empty{border:1px dashed #cbdcd6;background:#fbfdfc;color:var(--muted)}.error{border:1px solid #efcdd1;background:#fff7f8;color:#a34d57}.loading{text-align:center;padding:35px 10px;color:var(--muted);font-size:11px}.footer{text-align:center;color:#94a69f;font-size:9.5px;padding:18px 0 3px}@media(max-width:390px){.app{padding-left:11px;padding-right:11px}.grid{gap:8px}.tile{padding:9px;min-height:68px}.tile-icon{width:37px;height:37px}.tile-name{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <section class="screen active" id="home">
    <div id="launcherHeader"></div>
    <section class="hero">
      <h2 id="homeTitle">Web Apps</h2>
      <p id="homeDesc">Loading the latest app catalog from GitHub…</p>
      <div class="search"><span>⌕</span><input id="search" placeholder="Search apps..." autocomplete="off"></div>
    </section>
    <main id="homeContent"><div class="loading">Loading apps…</div></main>
    <div class="footer">AraafRoyall • Web-Apps</div>
  </section>

  <section class="screen" id="group">
    <button class="back" onclick="showHome()">‹ All Apps</button>
    <div class="page-head">
      <div id="groupIcon" class="page-icon green">*</div>
      <div><h2 id="groupTitle">Group</h2><p id="groupDesc"></p></div>
    </div>
    <div id="groupContent"></div>
  </section>
</div>

<script type="module">
import {RoyallUI} from './web/core2/master.js';

const BUILD_URL='./build.json';
const COLORS=['green','teal','amber','blue'];

let data={version:1,name:'Royall Web Apps',description:'Tools and utilities from AraafRoyall',WebAppsFolder:'web/',top:[],groups:[]};
let header;

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function colorFor(i){return COLORS[Math.floor(i/2)%COLORS.length]}
function safeIcon(v){const s=String(v??'').trim();return s||'*'}
function normalizeFolder(v){let f=String(v??'web/').trim().replace(/^\/+|\/+$/g,'');return f?f+'/':''}
function normalizeItem(item){const x=item&&typeof item==='object'?item:{};return {...x,name:String(x.name??''),description:String(x.description??''),url:String(x.url??''),icon:safeIcon(x.icon)}}
function normalizeGroup(group){const g=group&&typeof group==='object'?group:{};return {...g,name:String(g.name??''),description:String(g.description??''),icon:safeIcon(g.icon),items:Array.isArray(g.items)?g.items.map(normalizeItem):[]}}
function normalizeConfig(raw){const root=raw&&typeof raw==='object'?raw:{};return {...root,version:root.version??1,name:String(root.name??'Royall Web Apps'),description:String(root.description??''),WebAppsFolder:String(root.WebAppsFolder??'web/'),top:Array.isArray(root.top)?root.top.map(normalizeItem):[],groups:Array.isArray(root.groups)?root.groups.map(normalizeGroup):[]}}
function itemUrl(item){const raw=String(item?.url??'').trim();if(!raw)return '#';if(/^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(raw))return raw;return new URL(normalizeFolder(data.WebAppsFolder)+raw.replace(/^\/+/,''),document.baseURI||location.href).href}
function itemTile(item,index){const c=colorFor(index);return `<a class="tile" href="${esc(itemUrl(item))}"><div class="tile-icon ${c}">${esc(safeIcon(item.icon))}</div><div class="tile-body"><div class="tile-name">${esc(item.name||'Untitled')}</div><div class="tile-desc">${esc(item.description||'')}</div></div></a>`}
function groupTile(group,index,visual){const c=colorFor(visual);return `<button class="tile" type="button" data-group-index="${index}"><div class="tile-icon ${c}">${esc(safeIcon(group.icon))}</div><div class="tile-body"><div class="tile-name">${esc(group.name||'Group')}</div><div class="tile-desc">${esc(group.description||'')}</div></div></button>`}
function matchesText(obj,q){if(!q)return true;return (String(obj?.name??'')+' '+String(obj?.description??'')).toLowerCase().includes(q)}
function groupMatches(group,q){return !q||matchesText(group,q)||group.items.some(item=>matchesText(item,q))}
function bindGroupButtons(){document.querySelectorAll('[data-group-index]').forEach(b=>b.onclick=()=>openGroup(Number(b.dataset.groupIndex)))}
function renderHome(q=''){const search=String(q||'').trim().toLowerCase();let html='';data.top.forEach((item,i)=>{if(matchesText(item,search))html+=itemTile(item,i)});data.groups.forEach((group,i)=>{if(groupMatches(group,search))html+=groupTile(group,i,data.top.length+i)});document.getElementById('homeContent').innerHTML=html?`<div class="grid">${html}</div>`:'<div class="empty">No apps found.</div>';bindGroupButtons()}
function fillGroup(index){if(!Number.isInteger(index)||index<0||index>=data.groups.length)return false;const group=data.groups[index];const icon=document.getElementById('groupIcon');icon.className='page-icon '+colorFor(data.top.length+index);icon.textContent=safeIcon(group.icon);document.getElementById('groupTitle').textContent=group.name||'Group';document.getElementById('groupDesc').textContent=group.description||'';document.getElementById('groupContent').innerHTML=group.items.length?`<div class="grid">${group.items.map((item,i)=>itemTile(item,i)).join('')}</div>`:'<div class="empty">No apps in this group.</div>';return true}
function openGroup(index){if(!fillGroup(index))return;document.getElementById('home').classList.remove('active');document.getElementById('group').classList.add('active');location.hash='group='+index;scrollTo(0,0)}
window.showHome=function(){document.getElementById('group').classList.remove('active');document.getElementById('home').classList.add('active');if(location.hash)location.hash='';scrollTo(0,0)}
function route(){const m=location.hash.match(/^#group=(\d+)$/);if(m&&fillGroup(Number(m[1]))){document.getElementById('home').classList.remove('active');document.getElementById('group').classList.add('active');scrollTo(0,0);return}document.getElementById('group').classList.remove('active');document.getElementById('home').classList.add('active')}

header=RoyallUI.mount({mount:'#launcherHeader',icon:'R',title:'Royall Web Apps',description:'Loading catalog…',status:{text:'Loading…',mode:'info'}});
header.setButton({text:'Refresh',onClick:()=>location.reload()});

document.getElementById('search').addEventListener('input',e=>{if(document.getElementById('home').classList.contains('active'))renderHome(e.target.value)});
window.addEventListener('hashchange',route);

async function load(){
  try{
    const r=await fetch(BUILD_URL+'?v='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    data=normalizeConfig(await r.json());
    document.title=data.name;
    header.setHeader({title:data.name,description:'Live catalog from GitHub',status:{text:'Live ✔️',mode:'success'}});
    document.getElementById('homeTitle').textContent=data.name;
    document.getElementById('homeDesc').textContent=data.description||'Tools and utilities from AraafRoyall';
    renderHome();route();
  }catch(e){
    header.setStatus({text:'Unavailable',mode:'error'});
    header.setDescription('Catalog unavailable');
    document.getElementById('homeDesc').textContent='Could not load build.json.';
    document.getElementById('homeContent').innerHTML=`<div class="error">Unable to load the app catalog.<br><br>${esc(e.message)}</div>`;
  }
}
load();
</script>
</body>
</html>
