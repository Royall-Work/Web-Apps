<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Royall UI Sample 2</title>
<link rel="stylesheet" href="../core/royall-ui.css">
</head>
<body><div id="app"></div>
<script src="../core/royall-ui.js"></script>
<script>
let ui,input,result;
function clearAll(){RoyallUI.confirm({icon:'!',title:'Clear All?',text:'Clear this sample input and result?',confirmText:'Clear'},()=>{input.textarea.value='';result.textContent='Result cleared.';RoyallUI.toast('Cleared ✔️')})}
ui=RoyallUI.mount({mount:'#app',icon:'🧹',title:'Sample Two',description:'Optional top-right action',headerButton:{text:'Clear All',onClick:clearAll},featureRight:'Core Theme'});
const card=RoyallUI.card('Text to Process',{head:true,stats:'0 words • 0 chars',actions:[{text:'Clear',className:'royall-clear-small',onClick:()=>RoyallUI.clearConfirm(input.textarea,'text')},{text:'Paste',className:'royall-paste-small',onClick:async()=>input.textarea.value=await RoyallUI.paste()}]});
input=RoyallUI.textarea({placeholder:'Type text for this sample...'});
input.textarea.addEventListener('input',()=>{let s=input.textarea.value;card.querySelector('.royall-input-stats').textContent=(s.trim()?s.trim().split(/\s+/).length:0)+' words • '+[...s].length+' chars'});
card.appendChild(input.el);ui.content.appendChild(card);
result=RoyallUI.result('Result appears here.');
const rb=RoyallUI.card('Result',{head:true,stats:'Reusable controls',actions:[{text:'Copy',className:'royall-copy-small',onClick:()=>RoyallUI.copy(result.textContent)},{text:'Download',className:'royall-download-small',onClick:()=>RoyallUI.download('sample-two.txt',result.textContent)}]});
rb.appendChild(result);ui.content.appendChild(rb);
RoyallUI.bottomBar([{text:'Confirm',onClick:()=>RoyallUI.confirm({icon:'✅',title:'Confirmation',text:'This uses the shared dialog theme.',confirmText:'Continue',danger:false},()=>RoyallUI.toast('Confirmed ✔️'))},{text:'Choice',onClick:()=>RoyallUI.choice({icon:'🔹',title:'Choose Action',text:'Both choices inherit the same global dialog theme.'},[{text:'Option A',onClick:()=>RoyallUI.toast('Option A')},{text:'Option B',onClick:()=>RoyallUI.toast('Option B')}])}]);
</script></body></html>
