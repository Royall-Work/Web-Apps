<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Royall UI Sample 1</title>
<link rel="stylesheet" href="../core/royall-ui.css">
</head>
<body><div id="app"></div>
<script src="../core/royall-ui.js"></script>
<script>
const ui=RoyallUI.mount({mount:'#app',icon:'📝',title:'Sample One',description:'Basic shared parent layout'});
const box=RoyallUI.card('Text Input',{head:true,stats:'0 chars',actions:[
{text:'Clear',className:'royall-clear-small',onClick:()=>RoyallUI.clearConfirm(area.textarea,'text')},
{text:'Paste',className:'royall-paste-small',onClick:async()=>area.textarea.value=await RoyallUI.paste()}
]});
const area=RoyallUI.textarea({placeholder:'Type here...'});
area.textarea.addEventListener('input',()=>box.querySelector('.royall-input-stats').textContent=[...area.textarea.value].length+' chars');
box.appendChild(area.el);ui.content.appendChild(box);
const result=RoyallUI.card('Result',{head:true,stats:'Shared result field',actions:[{text:'Copy',className:'royall-copy-small',onClick:()=>RoyallUI.copy(area.textarea.value)}]});
result.appendChild(RoyallUI.result('This demonstrates the shared result styling.'));
ui.content.appendChild(RoyallUI.divider());ui.content.appendChild(result);
RoyallUI.fab('▶ Run Sample',()=>RoyallUI.toast('Sample action ✔️'));
</script></body></html>
