<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Royall UI Master • Final Tester</title>
<link rel="stylesheet" href="../core/master.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import {RoyallUI} from '../core/master.js';

const ui=RoyallUI.mount({
  mount:'#app',
  icon:'🧩',
  title:'Royall UI Master',
  description:'Modular Component & Activity Tester',
  status:'Active ✔️',
  headerButton:{text:'Reset',tone:'red',onClick:()=>location.reload()}
});

function row(items){
  const r=document.createElement('div');
  r.className='royall-chip-row';
  items.forEach(x=>r.appendChild(RoyallUI.button(x[0],x[1]||'royall-btn soft',x[2])));
  return r;
}

const pages=[];
const nav=RoyallUI.chipNav([
  {label:'Overview',value:0},
  {label:'Inputs',value:1},
  {label:'Dialogs',value:2},
  {label:'Controls',value:3}
],showPage);

for(let i=0;i<4;i++){
  const p=document.createElement('section');
  p.className='royall-page'+(i===0?' active':'');
  pages.push(p);
  ui.content.appendChild(p);
}
ui.content.prepend(nav);

function showPage(n){
  pages.forEach((p,i)=>p.classList.toggle('active',i===n));
  nav.querySelectorAll('.royall-chip').forEach((b,i)=>b.classList.toggle('active',i===n));
}

let c=RoyallUI.card('Master Architecture');
c.append(RoyallUI.message('Modular Master entry: components are provided by separate engine modules and exposed through RoyallUI.'));
pages[0].appendChild(c);

c=RoyallUI.card('Segmented Chips • Fixed by Count');
c.append(RoyallUI.message('2 = Green + Amber • 3 adds Blue • 4 adds Purple. Caller never supplies colors.'));
c.append(RoyallUI.segmentedChips([{label:'Encrypt'},{label:'Decrypt'}]));
c.append(RoyallUI.segmentedChips([{label:'Text'},{label:'File'},{label:'Folder'}]));
c.append(RoyallUI.segmentedChips([{label:'One'},{label:'Two'},{label:'Three'},{label:'Four'}]));
pages[0].appendChild(c);

c=RoyallUI.card('Status — Text Only');
c.append(row([
  ['Success','green',()=>ui.setStatus('Active ✔️','success')],
  ['Info','blue',()=>ui.setStatus('Ready ℹ️','info')],
  ['Error','danger',()=>ui.setStatus('Offline ✖','error')],
  ['Remove','soft',()=>ui.removeStatus()]
]));
pages[0].appendChild(c);

c=RoyallUI.card('Activity');
c.append(RoyallUI.message('Full Activity-style page changes icon, title, description and content inside the same HTML.'));
c.append(RoyallUI.button('Open Activity →','royall-btn green',()=>openActivity(0)));
pages[0].appendChild(c);

const inp=RoyallUI.input({
  placeholder:'Single-line input',
  actions:[{text:'Copy',onClick:x=>RoyallUI.copy(x.value)}]
});
c=RoyallUI.card('Input / EditText — Copy defaults to blue');
c.appendChild(inp.el);
pages[1].appendChild(c);

const ta=RoyallUI.textarea({placeholder:'Multiline text…'});
c=RoyallUI.card('Textarea — Semantic actions',{
  head:true,
  stats:'No className supplied',
  actions:[
    {text:'Clear',onClick:()=>RoyallUI.clearConfirm(ta.textarea,'text')},
    {text:'Paste',onClick:()=>RoyallUI.paste().then(v=>{if(v)ta.textarea.value=v})}
  ]
});
c.appendChild(ta.el);
pages[1].appendChild(c);

const ex=document.createElement('div');
ex.className='royall-expand';
ex.append(RoyallUI.message('Expandable content can live anywhere.'));
c=RoyallUI.card('Toggle / Expand');
c.appendChild(RoyallUI.button('Toggle Content','royall-btn soft',()=>RoyallUI.toggle(ex)));
c.appendChild(ex);
pages[1].appendChild(c);

const res=RoyallUI.result('Result line 1\nResult line 2\nLong values wrap automatically.');
c=RoyallUI.card('Result / Copy / Download',{
  head:true,
  result:true,
  stats:'Copy is automatic blue',
  actions:[
    {text:'Copy',onClick:()=>RoyallUI.copy(res.textContent)},
    {text:'Download',onClick:()=>RoyallUI.downloadNamed({extension:'.txt',value:'royall-test'},res.textContent)}
  ]
});
c.append(res);
pages[1].appendChild(c);

c=RoyallUI.card('Dialogs');
c.append(row([
  ['Confirm','soft',()=>RoyallUI.confirm({title:'Confirm',text:'Cancellable confirmation.',icon:'❓'},()=>RoyallUI.successToast('Confirmed'))],
  ['Warning','soft',()=>RoyallUI.warning({title:'Warning',text:'Amber text + matching border warning action.',icon:'⚠️'},()=>RoyallUI.warningToast('Continued'))],
  ['Error','soft',()=>RoyallUI.errorDialog({title:'Error',text:'Red error dialog.',icon:'✖️'})],
  ['Info','soft',()=>RoyallUI.infoDialog({title:'Info',text:'Blue information dialog.',icon:'ℹ️'})]
]));
c.append(row([
  ['Choice','soft',()=>RoyallUI.choice({title:'Choice',text:'Buttons wrap by text width.',icon:'🔘'},[
    {text:'One',onClick:()=>RoyallUI.successToast('One')},
    {text:'Two',onClick:()=>RoyallUI.successToast('Two')},
    {text:'Three',onClick:()=>RoyallUI.successToast('Three')},
    {text:'Four',onClick:()=>RoyallUI.successToast('Four')}
  ])],
  ['Edit Name','soft',()=>RoyallUI.prompt({title:'Edit Name',text:'Only input dialogs may use top gravity.',icon:'✏️',value:''},v=>RoyallUI.successToast(v||'Saved'))],
  ['Non-Cancel','soft',()=>RoyallUI.infoDialog({title:'Non-cancellable',text:'Backdrop and Escape cannot dismiss this dialog.',icon:'🔒',cancellable:false})]
]));
pages[2].appendChild(c);

c=RoyallUI.card('Toasts');
c.append(row([
  ['Success','green',()=>RoyallUI.successToast('Success')],
  ['Warning','soft',()=>RoyallUI.warningToast('Warning')],
  ['Error','danger',()=>RoyallUI.errorToast('Error')],
  ['Info','blue',()=>RoyallUI.toast('Info','info')]
]));
pages[2].appendChild(c);

c=RoyallUI.card('Controls');
const tb=RoyallUI.toggleButton({text:'Toggle me'});
c.append(tb,row([
  ['ON','soft',()=>tb.setState(true)],
  ['OFF','soft',()=>tb.setState(false)],
  ['Read','soft',()=>RoyallUI.infoDialog({title:'State',text:String(tb.getState())})]
]));
pages[3].appendChild(c);

c=RoyallUI.card('Bottom Bar + FAB');
c.append(row([
  ['Bottom Bar','green',()=>{
    const b=RoyallUI.bottomBar([
      {text:'Primary',onClick:()=>RoyallUI.successToast('Primary')},
      {text:'Secondary',onClick:()=>RoyallUI.warningToast('Secondary')}
    ]);
    setTimeout(()=>b.remove(),1800);
  }],
  ['FAB','soft',()=>{
    const b=RoyallUI.fab('Amber FAB',()=>RoyallUI.successToast('FAB'),true);
    setTimeout(()=>b.remove(),1800);
  }]
]));
pages[3].appendChild(c);

function openActivity(n){
  ui.setHeader({
    icon:n===0?'📄':n===1?'⚙️':'✅',
    title:'Sample Activity '+(n+1),
    description:n===0?'Complete page one':n===1?'Complete page two':'Complete page three'
  });
  ui.setHeaderButton({text:'Back',tone:'green',onClick:closeActivity});
  ui.content.innerHTML='';

  const p=document.createElement('section');
  p.className='royall-page active';

  const card=RoyallUI.card(n===0?'Activity Home':n===1?'Activity Settings':'Activity Complete');
  card.append(RoyallUI.message('Complete page replacement inside the same HTML. Header and description are changed.'));
  card.append(RoyallUI.segmentedChips([{label:'A'},{label:'B'},{label:'C'},{label:'D'}]));

  const ar=RoyallUI.result('Activity result\nCopy below uses automatic blue style.');
  const arc=RoyallUI.card('Activity Result',{
    head:true,
    result:true,
    actions:[{text:'Copy',onClick:()=>RoyallUI.copy(ar.textContent)}]
  });
  arc.append(ar);

  p.append(
    card,
    arc,
    row([
      ['← Back','soft',()=>n?openActivity(n-1):closeActivity()],
      ['Next →','green',()=>n<2?openActivity(n+1):closeActivity()]
    ])
  );
  ui.content.appendChild(p);
}

function closeActivity(){
  ui.setHeader({icon:'🧩',title:'Royall UI Master',description:'Modular Component & Activity Tester'});
  ui.setHeaderButton({text:'Reset',tone:'red',onClick:()=>location.reload()});
  ui.content.innerHTML='';
  ui.content.append(nav);
  pages.forEach(p=>ui.content.appendChild(p));
  showPage(0);
}

showPage(0);
</script>
</body>
</html>
