<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Royall UI v1 Test</title>
<link rel="stylesheet" href="../core/royall-ui.css">
</head>
<body>
<div id="app"></div>
<script src="../core/royall-ui.js"></script>
<script>
(function(){
  "use strict";
  var ui=RoyallUI.mount({mount:"#app",icon:"🧩",title:"Royall UI Test",description:"Shared parent layout • Core v1",status:{text:"• Script Init ✔️",right:"Core v1"},headerButton:{text:"Clear All",onClick:clearAll}});
  var input=RoyallUI.textarea({placeholder:"Enter text here..."});
  var inputCard=RoyallUI.card("Text to Process",{head:true,stats:"0 words • 0 chars",actions:[
    {text:"Clear",className:"royall-clear-small",onClick:function(){RoyallUI.clearConfirm(input.textarea,"text");}},
    {text:"Paste",className:"royall-paste-small",onClick:async function(){var v=await RoyallUI.paste();if(v!=="")input.textarea.value=v;}}
  ]});
  inputCard.appendChild(input.el);ui.content.appendChild(inputCard);
  var field=RoyallUI.input({placeholder:"Reusable input field",actions:[{text:"Copy",className:"royall-small-btn blue",onClick:function(x){RoyallUI.copy(x.value);}}]});
  var fieldCard=RoyallUI.card("Input Field");fieldCard.appendChild(field.el);ui.content.appendChild(fieldCard);
  ui.content.appendChild(RoyallUI.divider());
  var result=RoyallUI.result("Result will appear here.");
  var resultCard=RoyallUI.card("Result",{head:true,result:true,stats:"0 chars",actions:[
    {text:"Copy",className:"royall-blue-btn",onClick:function(){RoyallUI.copy(result.textContent);}},
    {text:"Download",className:"royall-download-btn",onClick:function(){RoyallUI.download("royall-test.txt",result.textContent);}}
  ]});
  resultCard.appendChild(result);ui.content.appendChild(resultCard);
  RoyallUI.bottomBar([
    {text:"Confirm",onClick:function(){RoyallUI.confirm({icon:"✅",title:"Confirmation",text:"Shared two-button confirmation dialog.",confirmText:"Continue",danger:false},function(){RoyallUI.toast("Confirmed ✔️");});}},
    {text:"Choice",onClick:function(){RoyallUI.choice({icon:"🔹",title:"Choose",text:"Shared choice dialog."},[{text:"Option A",onClick:function(){RoyallUI.toast("Option A");}},{text:"Option B",onClick:function(){RoyallUI.toast("Option B");}}]);}}
  ]);
  function clearAll(){RoyallUI.confirm({icon:"!",title:"Clear All?",text:"Clear the demo input and result?",confirmText:"Clear"},function(){input.textarea.value="";result.textContent="Result will appear here.";RoyallUI.toast("Cleared ✔️");});}
})();
</script>
</body>
</html>
