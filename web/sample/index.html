<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Royall UI Engine • Deep Test</title><link rel="stylesheet" href="../core/royall-ui.css"></head>
<body><div id="app"></div><script src="../core/royall-ui.js"></script><script>
(function(){
var ui=RoyallUI.mount({mount:'#app',icon:'🧩',title:'Royall UI Engine',description:'Deep Component & API Test',status:{text:'Active ✔️',mode:'success'},headerButton:{text:'Clear',tone:'red',onClick:function(){RoyallUI.confirm({icon:'🗑️',title:'Clear Test?',text:'Runner-defined header action.',cancelText:'No',confirmText:'Yes'},function(){RoyallUI.successToast('Cleared')})}}});
var nav=RoyallUI.chipNav([{label:'Overview',value:0},{label:'Inputs',value:1},{label:'Dialogs',value:2},{label:'Controls',value:3}],function(v){show(v)});ui.content.appendChild(nav);var pages=[];for(var i=0;i<4;i++){var p=document.createElement('section');p.className='royall-page'+(i===0?' active':'');pages.push(p);ui.content.appendChild(p)}function show(n){pages.forEach(function(p,i){p.classList.toggle('active',i===n)});Array.prototype.forEach.call(nav.children,function(b,i){b.classList.toggle('active',i===n)})}
function add(p,c){p.appendChild(c);return c}function btn(text,cls,fn){return RoyallUI.button(text,'royall-btn '+(cls||'soft'),fn)}
var o=RoyallUI.card('Parent Layout');var om=document.createElement('div');om.className='royall-message';om.textContent='Fixed header + attribution + optional right status + caller content. No status is rendered when status is omitted.';o.appendChild(om);add(pages[0],o);
var hc=RoyallUI.card('Header Button Tones');var hg=document.createElement('div');hg.className='royall-tone-grid';[['Red','red'],['Green','green'],['Blue','blue'],['Amber','amber']].forEach(function(x){var b=document.createElement('button');b.type='button';b.className='tone-'+x[1];b.textContent=x[0];b.onclick=function(){ui.setHeaderButton({text:x[0],tone:x[1],onClick:function(){RoyallUI.successToast(x[0]+' action')}})};hg.appendChild(b)});hc.appendChild(hg);hc.appendChild(btn('Custom Purple','soft',function(){ui.setHeaderButton({text:'Purple',color:'#7542b8',textColor:'#fff',borderColor:'#7542b8',onClick:function(){RoyallUI.infoDialog({title:'Custom Header',text:'Caller supplied color.'})}})}));add(pages[0],hc);
var st=RoyallUI.card('Status Modes');var sg=document.createElement('div');sg.className='royall-tone-grid';[['Success','success','Active ✔️'],['Error','error','Offline ✖'],['Info','info','Ready ℹ️'],['Remove','remove','']].forEach(function(x){var b=document.createElement('button');b.type='button';b.className='tone-'+(x[1]==='remove'?'red':x[1]);b.textContent=x[0];b.onclick=function(){x[1]==='remove'?ui.removeStatus():ui.setStatus(x[2],x[1])};sg.appendChild(b)});st.appendChild(sg);add(pages[0],st);
var ta=RoyallUI.textarea({placeholder:'Type text...'}),tc=RoyallUI.card('Textarea',{head:true,stats:'Reusable',actions:[{text:'Clear',className:'royall-clear-small',onClick:function(){RoyallUI.clearConfirm(ta.textarea,'text')}},{text:'Paste',className:'royall-paste-small',onClick:async function(){var v=await RoyallUI.paste();if(v)ta.textarea.value=v}}]});tc.appendChild(ta.el);add(pages[1],tc);
var inp=RoyallUI.input({placeholder:'Single-line input',actions:[{text:'Copy',className:'royall-small-btn blue',onClick:function(x){RoyallUI.copy(x.value)}}]}),ic=RoyallUI.card('Input');ic.appendChild(inp.el);add(pages[1],ic);
var chips=RoyallUI.chipNav([{label:'Green'},{label:'Amber'},{label:'Blue'},{label:'Purple'}],function(v){RoyallUI.successToast('Selected '+v.label)}),cc=RoyallUI.card('4-Chip Navbar');cc.appendChild(chips);add(pages[1],cc);
var ex=document.createElement('div');ex.className='royall-expand';ex.innerHTML='<div class="royall-divider"></div><div class="royall-empty">Expandable content can live anywhere.</div>';var ec=RoyallUI.card('Expandable');ec.appendChild(ex);ec.appendChild(btn('Toggle Content','soft',function(){RoyallUI.toggle(ex)}));add(pages[1],ec);
var dc=RoyallUI.card('Dialog Suite');var dw=document.createElement('div');dw.className='royall-chip-row';[['Confirm',function(){RoyallUI.confirm({title:'Confirm',text:'Fixed confirm theme.',cancelText:'No',confirmText:'Yes'},function(){RoyallUI.successToast('Confirmed')})}],['Warning',function(){RoyallUI.warning({title:'Warning',text:'Amber warning.',cancelText:'Cancel',confirmText:'Proceed'})}],['Error',function(){RoyallUI.errorDialog({title:'Error',text:'Red error.'})}],['Info',function(){RoyallUI.infoDialog({title:'Info',text:'Blue information.'})}],['Choice',function(){RoyallUI.choice({title:'Choice',text:'Caller actions.'},[{text:'Alpha',onClick:function(){RoyallUI.successToast('Alpha')}},{text:'Beta',onClick:function(){RoyallUI.warningToast('Beta')}}])}],['Edit Name',function(){RoyallUI.prompt({icon:'✏️',title:'Edit Name',text:'Top-gravity name editor.',placeholder:'Name',value:'Royall',gravity:'top'},function(v){RoyallUI.successToast('Name: '+v)})}]].forEach(function(x){dw.appendChild(btn(x[0],'soft',x[1]))});dc.appendChild(dw);add(pages[2],dc);
var tv=RoyallUI.card('Toast Variants');var tw=document.createElement('div');tw.className='royall-chip-row';[['Success','success'],['Warning','warning'],['Error','error'],['Info','info']].forEach(function(x){tw.appendChild(btn(x[0],'soft',function(){RoyallUI.toast(x[0]+' toast',x[1])}))});tv.appendChild(tw);add(pages[2],tv);
var tg=RoyallUI.card('Purple Toggle Button');var toggle=RoyallUI.toggleButton({text:'Enable Feature',onChange:function(on,b){b.setText(on?'Disable Feature':'Enable Feature');RoyallUI.successToast(on?'Enabled':'Disabled')}});tg.appendChild(toggle);var tr=document.createElement('div');tr.className='royall-chip-row';tr.appendChild(btn('Set ON','soft',function(){toggle.setState(true)}));tr.appendChild(btn('Set OFF','soft',function(){toggle.setState(false)}));tr.appendChild(btn('Change Text','soft',function(){toggle.setText(toggle.getState()?'Turn Off':'Turn On')}));tg.appendChild(tr);add(pages[3],tg);
var rh=RoyallUI.card('Runtime Header / Status');rh.appendChild(btn('Status Green','green',function(){ui.setStatus('Active ✔️','success')}));rh.appendChild(btn('Status Red','danger',function(){ui.setStatus('Offline ✖','error')}));rh.appendChild(btn('Status Blue','blue',function(){ui.setStatus('Ready ℹ️','info')}));rh.appendChild(btn('Remove Status','soft',function(){ui.removeStatus()}));add(pages[3],rh);
var res=RoyallUI.result('Result line 1\nResult line 2\nResult line 3'),rc=RoyallUI.card('Result + Download',{head:true,result:true,stats:'3 lines',actions:[{text:'Copy',className:'royall-copy-small',onClick:function(){RoyallUI.copy(res.textContent)}},{text:'Download',className:'royall-download-small',onClick:function(){RoyallUI.downloadNamed({extension:'.txt',value:'royall-test'},res.textContent)}}]});rc.appendChild(res);add(pages[3],rc);
var ac=RoyallUI.card('Bottom Actions');ac.appendChild(btn('Show Bottom Bar','green',function(){RoyallUI.bottomBar([{text:'Primary',onClick:function(){RoyallUI.successToast('Primary') }},{text:'Secondary',onClick:function(){RoyallUI.warningToast('Secondary')}}])}));ac.appendChild(btn('Show Amber FAB','amber',function(){var b=RoyallUI.fab('Floating Action',function(){RoyallUI.successToast('FAB clicked')},true);setTimeout(function(){b.remove()},3000)}));add(pages[3],ac);
})();
</script></body></html>
