<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Royall UI Core2 • Top Bar Test</title>
<link rel="stylesheet" href="./master.css">
</head>
<body>
<div id="app"></div>
<script src="./master.js"></script>
<script>
var ui=RoyallUI.mount({
  mount:'#app',
  icon:'🧩',
  title:'Royall UI Core2',
  description:'Minimal top bar test',
  status:{text:'Ready ✔️',mode:'success'}
});

var box=document.createElement('section');
box.className='royall-demo';
box.innerHTML='<h2>Top Bar Test</h2><p>Only the top layout is implemented in Core2 for now.</p>';
ui.content.appendChild(box);

var b=document.createElement('button');
b.textContent='Change Header Button';
b.onclick=function(){
  ui.setButton({text:'Clear',onClick:function(){alert('Optional top-right button clicked')}});
};
box.appendChild(b);
</script>
</body>
</html>
